name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - run: test -z "$(gofmt -l .)"
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: api
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Fuzz (fixed budget)
        run: |
          for t in $(grep -rhoE '^func (Fuzz[A-Za-z0-9_]+)' --include='*_test.go' . | awk '{print $2}' | sort -u); do
            pkg=$(grep -rlE "^func $t\b" --include='*_test.go' . | head -1 | xargs dirname)
            go test "$pkg" -run '^$' -fuzz "^$t\$" -fuzztime 15s
          done
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      # Excluded rules are reviewed in Security.md: unhandled Close errors, permission rules (a tool that
      # receives files writes 0644/0755 on purpose), and taint rules on paths that safeJoin/SanitizeName validate.
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-generated -exclude=G104,G115,G204,G301,G302,G304,G306,G404,G702,G703,G704,G705 ./...

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run format:check
      - run: bun test src
      - run: bun audit
        continue-on-error: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
      - name: Build sharingd for the interop tests
        run: cd api && go build -o "$RUNNER_TEMP/sharingd" ./cmd/sharingd
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: ktlint
        run: |
          curl -sSL -o "$RUNNER_TEMP/ktlint" https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          cd mobile/modules/sharing-service/android && "$RUNNER_TEMP/ktlint" "src/**/*.kt"
      - name: Prebuild
        working-directory: mobile
        run: |
          bun install --frozen-lockfile
          bunx expo prebuild --platform android --no-install
      - name: Compile, unit tests (including interop with sharingd), Android lint
        working-directory: mobile/android
        env:
          SHARINGD_BIN: ${{ runner.temp }}/sharingd
        run: ./gradlew :sharing-service:compileDebugKotlin :sharing-service:testDebugUnitTest :sharing-service:lintDebug
      - name: Default build asks for no log access or overlay
        working-directory: mobile/android
        run: ./gradlew :app:processReleaseMainManifest && ../../scripts/check-manifest.sh
      - name: Opt-in build declares them
        run: |
          cd mobile && SHARING_AUTO_CLIPBOARD=1 bunx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew :app:processReleaseMainManifest && ../../scripts/check-manifest.sh --auto-clipboard
